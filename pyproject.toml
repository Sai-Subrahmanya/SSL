[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-street-light-v1"
version = "0.1.0"
description = "Smart Street Light V1 - digital prototype domain model (engineering prototype, not production firmware)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary - engineering prototype" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
# The digital prototype is deterministic: no timing-dependent or random tests.
filterwarnings = ["error"]
